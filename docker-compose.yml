services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: campus_ai
      POSTGRES_USER: campus_ai
      POSTGRES_PASSWORD: campus_ai_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus_ai -d campus_ai"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
